# NICo Control Plane Validation Configuration
#
# Imports the provider-agnostic control-plane contract and wires the NICo API
# health step, adapted from the earlier Carbide provider work. The access-key,
# tenant, and object-lifecycle checks in that contract skip until NICo wires
# their steps.
#
# Required:
#   NICO_API_BASE, NICO_ORGANIZATION, NICO_SITE_ID, and NICo auth.
#
# Usage:
#   uv run isvctl test run -f isvctl/configs/providers/nico/config/control-plane.yaml

import:
  - ../../../suites/control-plane.yaml

version: "1.0"

commands:
  control_plane:
    phases: ["test"]
    steps:
      - name: check_api
        phase: test
        command: "python ../scripts/control-plane/check_api.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

tests:
  cluster_name: "nico-control-plane-validation"
  description: "Verify NICo API health"

  settings:
    org: "{{env.NICO_ORGANIZATION}}"
    site_id: "{{env.NICO_SITE_ID}}"
    nico_api_base: "{{env.NICO_API_BASE}}"
