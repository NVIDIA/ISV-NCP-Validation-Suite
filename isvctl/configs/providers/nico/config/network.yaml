# NICo Network Validation Configuration
#
# Imports the provider-agnostic network contract and wires the read-only VPC and
# subnet inventory steps, adapted from the earlier Carbide provider work. The
# VPC/SG/SDN lifecycle and traffic checks in that contract skip until NICo wires
# their steps.
#
# Required:
#   NICO_API_BASE, NICO_ORGANIZATION, NICO_SITE_ID, and NICo auth.
#
# Optional:
#   NICO_VPC_ID and NICO_SUBNET_ID narrow checks to known pre-existing
#   resources. If omitted, detail checks use the first matching resource found
#   at the site.
#
# Usage:
#   uv run isvctl test run -f isvctl/configs/providers/nico/config/network.yaml

import:
  - ../../../suites/network.yaml

version: "1.0"

commands:
  network:
    phases: ["test"]
    steps:
      - name: list_vpcs
        phase: test
        command: "python ../scripts/network/list_vpcs.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--vpc-id={{vpc_id}}"
        timeout: 120

      - name: get_vpc
        phase: test
        command: "python ../scripts/network/get_vpc.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--vpc-id={{vpc_id}}"
        timeout: 120

      - name: subnet_assignment
        phase: test
        command: "python ../scripts/network/check_subnet_assignment.py"
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
          - "--vpc-id={{vpc_id}}"
          - "--subnet-id={{subnet_id}}"
        timeout: 120

tests:
  cluster_name: "nico-network-validation"
  description: "Verify NICo VPC and subnet inventory"

  settings:
    org: "{{env.NICO_ORGANIZATION}}"
    site_id: "{{env.NICO_SITE_ID}}"
    nico_api_base: "{{env.NICO_API_BASE}}"
    vpc_id: "{{env.NICO_VPC_ID}}"
    subnet_id: "{{env.NICO_SUBNET_ID}}"
