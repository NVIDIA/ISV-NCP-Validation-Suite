          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

tests:
  cluster_name: "nico-remediation-validation"
  description: "Verify NICo break-fix observability and document known remediation gaps"

  settings:
    org: "{{env.NICO_ORGANIZATION}}"
    site_id: "{{env.NICO_SITE_ID}}"
    nico_api_base: "{{env.NICO_API_BASE}}"
    machine_id: "{{env.NICO_MACHINE_ID | default('', true)}}"
    rack_id: "{{env.NICO_RACK_ID | default('', true)}}"

  exclude:
    labels: []
