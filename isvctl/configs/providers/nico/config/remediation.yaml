# NICo Break-Fix / Remediation Validation Configuration
#
# Imports suites/remediation.yaml and wires read-only NICo steps where the
# tenant REST API exposes break-fix observability. Mutating lifecycle actions,
# GPUd/Sentinel (Maestro), and tenant notification channels emit structured
# skips documenting known gaps.
#
# Implemented on NICo (read-only):
#   - query_serial_numbers      (BFX03-01) — reuses hardware_inventory script
#   - query_maintenance_events  (BFX02-01) — maintenanceMessage + Maintenance status
#   - query_repair_history      (BFX02-03) — statusHistory + RepairStatus labels
#
# Skipped on NICo (documented gap):
#   - BFX01 lifecycle (mutating repair workflows / k8s cordon)
#   - BFX02-02 retirement notices
#   - BFX03-02 NV switch firmware, BFX03-03 BMC kernel logs (unless health exposes signal)
#   - BFX04–BFX06 Maestro / notification channels
#
# Usage:
#   NICO_BEARER_TOKEN=<token> NICO_ORGANIZATION=<org> NICO_SITE_ID=<uuid> \
#     uv run isvctl test run -f isvctl/configs/providers/nico/config/remediation.yaml \
#     --capability bare_metal

import:
  - ../../../suites/remediation.yaml

version: "1.0"

commands:
  remediation:
    phases: ["test"]
    steps:
      - name: query_serial_numbers
        phase: test
        continue_on_failure: true
        command: "python ../scripts/hardware_inventory/query_serial_numbers.py"
        requires: [bare_metal]
        args:
          - "--org"
          - "{{org}}"
          - "--site-id"
          - "{{site_id}}"
          - "--api-base"
          - "{{nico_api_base}}"
        timeout: 120

      - name: query_maintenance_events
        phase: test
