# IAM User Lifecycle Validation - Canonical Contract
#
# Validations-only contract for IAM. Provider configs import this file
# and supply their own commands (steps + scripts).
#
# This file defines WHAT to validate, not HOW to run it. Each validation
# only inspects JSON output fields. As long as your scripts output the
# right fields, the validations pass regardless of which IAM system you use.
#
# Quick start:
#   1. Copy providers/my-isv/config/iam.yaml to providers/<your-platform>/config/iam.yaml
#   2. Replace stub paths with your platform scripts
#   3. Run: uv run isvctl test run -f isvctl/configs/providers/<your-platform>/config/iam.yaml
#
# See also:
#   - my-isv living example: providers/my-isv/config/iam.yaml
#   - AWS reference: providers/aws/config/iam.yaml + providers/aws/scripts/iam/
#   - Per-step field breakdown: ../suites/README.md

version: "1.0"

tests:
  cluster_name: "iam-validation"
  description: "IAM user lifecycle validation"

  settings:
    # Provider-specific - override in your provider config
    region: ""
    teardown_flag: "{{(env.IAM_SKIP_TEARDOWN == 'true') | ternary('--skip-destroy', '')}}"

  # ─── Validations ─────────────────────────────────────────────────
  # These are PROVIDER-AGNOSTIC. They only check JSON field names/values.
  # You should NOT need to change these unless you add extra checks.
  validations:
    setup_checks:
      step: create_user
      checks:
        # No plan item for creation alone: IAM01-01 is "create user and log in as
        # that user", and issuing an access key does not establish the login.
        # IamUserAuthenticatedCheck claims it from the test_credentials step.
        # Keeps min_req so a min_req-only run still creates the user the
        # credential checks need - setup steps are skipped when every check bound
        # to them is filtered out.
        IamUserCreatedCheck:
          test_id: "N/A"
          labels: ["iam", "min_req"]
          requires: []
          description: "Check the IAM user is created and its access key is returned"
          compose:
            - StepSuccessCheck
            - FieldExistsCheck:
                fields: ["username", "access_key_id"]

    # Whoami on the credentials the run itself is configured with, before any
    # user is created. Platforms that only expose read-only IAM can wire this
    # step alone and skip the lifecycle checks above.
    caller_identity:
      step: check_credentials
      checks:
        IamCredentialsAuthenticateCheck:
          # No plan item for "the operator's own credentials work"; user
          # lifecycle is IAM01-01/IAM02-01 and user API access is IAM03-01.
          test_id: "N/A"
          labels: ["iam"]
          requires: []
          description: "Check the configured credentials authenticate and resolve to an account identity"
          compose:
            - StepSuccessCheck
            - FieldExistsCheck:
                fields: ["account_id", "identity_id"]
            - FieldValueCheck:
                field: "authenticated"
                expected: true

    # The step reports identity and access as separate probes, so each plan item
    # gets the half that proves it: logging in (IAM01-01) and reaching an
    # authorized resource once logged in (IAM03-01).
    credentials:
      step: test_credentials
      checks:
        IamUserAuthenticatedCheck:
          test_id: "IAM01-01"
          labels: ["iam", "min_req"]
          requires: []
          description: "Check the created user can log in with the credentials it was issued"
          compose:
            - StepSuccessCheck
            - IamCredentialAccessCheck:
                required_tests: ["identity"]
        IamUserApiAccessCheck:
          test_id: "IAM03-01"
          labels: ["iam"]
          requires: []
          description: "Check the logged-in user can reach its authorized resources"
          compose:
            - IamCredentialAccessCheck:
                required_tests: ["access"]

    teardown_checks:
      step: teardown
      checks:
        IamUserDeletedCheck:
          test_id: "IAM02-01"
          labels: ["iam"]
          requires: []
          description: "Check the IAM user and its credentials are deleted"
          compose:
            - StepSuccessCheck

  exclude:
    labels: []
