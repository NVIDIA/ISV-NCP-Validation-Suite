# Break-Fix / Remediation Validation - Canonical Contract
#
# Provider-agnostic contract for break-fix (BFX) requirements: lifecycle
# actions, maintenance/repair event queries, diagnostics, and tenant
# notification observability. Provider configs import this file and supply
# scripts that emit the JSON fields each validation asserts.
#
# Quick start:
#   1. Copy providers/my-isv/config/remediation.yaml to providers/<platform>/config/
#   2. Replace stub paths with platform scripts (see providers/my-isv/scripts/remediation/)
#   3. Run: uv run isvctl test run --provider <platform> --suite remediation
#   4. Add --capability bare_metal and/or --capability kubernetes for gated checks
#
# See also:
#   - my-isv living example: providers/my-isv/config/remediation.yaml
#   - NICo reference: providers/nico/config/remediation.yaml
#   - Per-step field breakdown: ../suites/README.md

version: "1.0"

tests:
  cluster_name: "remediation-validation"
  description: "Break-fix / remediation validation (BFX01–BFX06)"

  settings:
    region: ""
    instance_type: ""
    machine_id: "{{env.REMEDIATION_MACHINE_ID | default('', true)}}"
    rack_id: "{{env.REMEDIATION_RACK_ID | default('', true)}}"

  validations:
    # ─── BFX03 Diagnostics ───────────────────────────────────────────
    hardware_serials:
      step: query_serial_numbers
      checks:
        HardwareSerialCheck:
          test_id: "BFX03-01"
          labels: ["bare_metal", "breakfix", "min_req", "remediation"]
          requires: [bare_metal]
          min_machines: 1

    switch_firmware:
      step: query_switch_firmware
      checks:
        NvSwitchFirmwareCheck:
          test_id: "BFX03-02"
          labels: ["min_req", "remediation"]
          requires: [bare_metal]
          min_trays: 1

    bmc_kernel_logs:
      step: query_bmc_kernel_logs
      checks:
        BmcKernelLogCheck:
          test_id: "BFX03-03"
          labels: ["min_req", "remediation"]
          requires: [bare_metal]
          min_hosts: 1

    # ─── BFX02 Events Query ────────────────────────────────────────────
    maintenance_events:
      step: query_maintenance_events
      checks:
        MaintenanceEventsCheck:
          test_id: "BFX02-01"
          labels: ["min_req", "remediation"]
          requires: [bare_metal]

    retirement_notices:
      step: query_retirement_notices
      checks:
        RetirementNoticesCheck:
          test_id: "BFX02-02"
          labels: ["min_req", "remediation"]
          requires: [bare_metal]

    repair_history:
      step: query_repair_history
      checks:
        RepairHistoryCheck:
          test_id: "BFX02-03"
          labels: ["min_req", "remediation"]
          requires: [bare_metal]

    # ─── BFX01 Lifecycle ───────────────────────────────────────────────
    gpu_reset:
      step: reset_gpus
      checks:
        GpuResetCheck:
          test_id: "BFX01-01"
          labels: ["min_req", "remediation"]
          requires: [kubernetes, bare_metal]

    return_node_maintenance:
      step: return_node_maintenance
      checks:
        ReturnNodeMaintenanceCheck:
          test_id: "BFX01-02"
          labels: ["min_req", "remediation"]
          requires: [bare_metal]

    return_rack_maintenance:
      step: return_rack_maintenance
      checks:
        ReturnRackMaintenanceCheck:
          test_id: "BFX01-03"
          labels: ["min_req", "remediation"]
          requires: [bare_metal]

    cordon_node:
      step: cordon_node
      checks:
        CordonNodeCheck:
          test_id: "BFX01-04"
          labels: ["min_req", "remediation"]
          requires: [kubernetes]

    host_replacement:
      step: request_host_replacement
      checks:
        HostReplacementCheck:
          test_id: "BFX01-05"
          labels: ["min_req", "remediation"]
          requires: [bare_metal]

    # ─── BFX04–BFX06 Reference (NSRG) ──────────────────────────────────
    node_health_agents:
      step: query_node_health_agents
      checks:
        NodeHealthAgentCheck:
          test_id: "BFX04-01"
          labels: ["remediation"]
          requires: []

    planned_maintenance_notification:
      step: query_planned_notifications
      checks:
        PlannedMaintenanceNotificationCheck:
          test_id: "BFX05-01"
          labels: ["remediation"]
          requires: []

    failure_notification:
      step: query_failure_notifications
      checks:
        FailureNotificationCheck:
          test_id: "BFX06-01"
          labels: ["remediation"]
          requires: []

  exclude:
    labels: []
