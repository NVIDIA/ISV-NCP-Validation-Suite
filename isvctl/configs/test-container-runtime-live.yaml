import:
  - suites/bare_metal.yaml

version: "1.0"

commands:
  bare_metal:
    phases: ["test"]
    steps:
      - name: describe_instance
        phase: test
        command: "python3 -c \"import json; print(json.dumps({'success':True,'platform':'k8s-node','host':'127.0.0.1','ssh_user':'ubuntu','ssh_key_path':'/home/ubuntu/.ssh/id_ed25519','instance_state':'running'}))\""
        timeout: 10

tests:
  exclude:
    tests:
      - BmHostReadyCheck
      - BmGpusPresentCheck
      - BmVcpuPinningCheck
      - BmPciBusCheck
      - BmHostSoftwareCheck
      - BmGpuStressCheck
      - BmNcclCheck
      - BmTrainingCheck
      - BmNvlinkCheck
      - BmInfiniBandCheck
      - BmEthernetCheck
      - BmGpuDriverCheck
      - BmCpuInfoCheck
